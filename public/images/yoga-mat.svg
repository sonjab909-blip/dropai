<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="12" fill="#F8FAFC"/>
  <!-- Rolled yoga mat -->
  <rect x="60" y="100" width="280" height="180" rx="20" fill="#14B8A6" stroke="#0D9488" stroke-width="2"/>
  <rect x="60" y="100" width="280" height="180" rx="20" fill="url(#matTexture)" opacity="0.3"/>
  <defs>
    <pattern id="matTexture" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#0F766E"/>
    </pattern>
  </defs>
  <!-- Mat surface texture lines -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="140" x2="300" y2="140" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="160" x2="300" y2="160" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="180" x2="300" y2="180" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="220" x2="300" y2="220" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="260" x2="300" y2="260" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <!-- Alignment lines -->
  <line x1="200" y1="110" x2="200" y2="270" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,4"/>
  <line x1="150" y1="110" x2="150" y2="270" stroke="#FFFFFF" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="250" y1="110" x2="250" y2="270" stroke="#FFFFFF" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <!-- Rolled end right -->
  <ellipse cx="340" cy="190" rx="20" ry="90" fill="#0D9488" stroke="#0F766E" stroke-width="2"/>
  <ellipse cx="340" cy="190" rx="14" ry="84" fill="#14B8A6"/>
  <ellipse cx="340" cy="190" rx="6" ry="78" fill="#0D9488" opacity="0.3"/>
  <!-- Carrying strap -->
  <rect x="180" y="85" width="40" height="8" rx="4" fill="#334155"/>
  <rect x="180" y="287" width="40" height="8" rx="4" fill="#334155"/>
  <!-- Strap front -->
  <path d="M185 85 Q185 50 200 40 Q215 50 215 85" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M185 287 Q185 320 200 330 Q215 320 215 287" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" font-weight="500">Premium Yoga Mat</text>
</svg>