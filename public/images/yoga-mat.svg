<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="40%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="matHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="matInnerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="endGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <!-- Shadow under mat -->
  <ellipse cx="210" cy="330" rx="100" ry="14" fill="#0F172A" opacity="0.1"/>
  <!-- Rolled yoga mat at an angle -->
  <g filter="url(#shadow)" transform="rotate(-8, 200, 200)">
    <!-- Main rolled body -->
    <ellipse cx="130" cy="220" rx="30" ry="85" fill="url(#matGrad)"/>
    <!-- Highlight on top of roll -->
    <ellipse cx="128" cy="170" rx="24" ry="40" fill="url(#matHighlight)"/>
    <!-- Inner spiral / rolled layers on the side -->
    <ellipse cx="130" cy="220" rx="30" ry="85" fill="none" stroke="#0F766E" stroke-width="1" opacity="0.3"/>
    <ellipse cx="130" cy="220" rx="25" ry="78" fill="none" stroke="#0F766E" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="130" cy="220" rx="20" ry="70" fill="none" stroke="#0F766E" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="130" cy="220" rx="15" ry="62" fill="none" stroke="#0F766E" stroke-width="0.8" opacity="0.2"/>
    <!-- Flat unrolled portion coming out -->
    <path d="M130 135 Q160 130 200 140 Q240 150 270 160 Q280 162 280 168 Q280 174 270 172 Q240 162 200 152 Q160 142 130 145 Z" fill="url(#matGrad)"/>
    <!-- Unrolled portion highlight -->
    <path d="M130 137 Q160 132 200 142 Q240 152 270 162 Q275 163 275 166 Q275 169 270 168 Q240 158 200 148 Q160 138 130 141 Z" fill="url(#matHighlight)"/>
    <!-- Texture lines on unrolled portion -->
    <path d="M140 140 Q170 135 205 144" stroke="#5EEAD4" stroke-width="0.5" opacity="0.2"/>
    <path d="M150 144 Q180 139 215 148" stroke="#5EEAD4" stroke-width="0.5" opacity="0.2"/>
    <path d="M160 148 Q190 143 225 152" stroke="#5EEAD4" stroke-width="0.5" opacity="0.2"/>
    <!-- Top end (looking into the roll) -->
    <ellipse cx="130" cy="137" rx="26" ry="8" fill="url(#endGrad)"/>
    <ellipse cx="130" cy="137" rx="22" ry="5" fill="#115E59"/>
    <ellipse cx="130" cy="137" rx="18" ry="3" fill="#0F766E"/>
    <!-- Bottom end -->
    <ellipse cx="130" cy="305" rx="26" ry="8" fill="url(#endGrad)"/>
    <ellipse cx="130" cy="305" rx="22" ry="5" fill="#115E59"/>
    <!-- Straps -->
    <g filter="url(#softShadow)">
      <!-- Top strap -->
      <rect x="100" y="175" width="65" height="16" rx="3" fill="url(#strapGrad)" transform="rotate(-3, 132, 183)"/>
      <rect x="103" y="179" width="59" height="8" rx="2" fill="#1E293B" opacity="0.5"/>
      <!-- Bottom strap -->
      <rect x="100" y="255" width="65" height="16" rx="3" fill="url(#strapGrad)" transform="rotate(3, 132, 263)"/>
      <rect x="103" y="259" width="59" height="8" rx="2" fill="#1E293B" opacity="0.5"/>
      <!-- Strap buckle top -->
      <rect x="155" y="174" width="10" height="18" rx="2" fill="#64748B" stroke="#475569" stroke-width="0.5"/>
      <!-- Strap buckle bottom -->
      <rect x="155" y="254" width="10" height="18" rx="2" fill="#64748B" stroke="#475569" stroke-width="0.5"/>
    </g>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" font-weight="600" letter-spacing="0.5">Premium Yoga Mat</text>
</svg>