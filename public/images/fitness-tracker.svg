<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="12" fill="#F8FAFC"/>
  <!-- Watch band top -->
  <rect x="170" y="60" width="60" height="80" rx="12" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="175" y="65" width="50" height="70" rx="10" fill="#334155"/>
  <!-- Watch face -->
  <rect x="155" y="130" width="90" height="120" rx="20" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="162" y="137" width="76" height="106" rx="16" fill="#0F172A"/>
  <!-- Display screen -->
  <rect x="168" y="143" width="64" height="94" rx="12" fill="#1E3A5F"/>
  <!-- Time display -->
  <text x="200" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#E2E8F0" font-weight="bold">10:30</text>
  <!-- Heart icon -->
  <path d="M185 195 L200 208 L215 195" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="208" r="3" fill="#EF4444"/>
  <!-- Steps -->
  <text x="200" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">8,420 steps</text>
  <!-- Watch band bottom -->
  <rect x="170" y="250" width="60" height="80" rx="12" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="175" y="255" width="50" height="70" rx="10" fill="#334155"/>
  <!-- Buckle holes -->
  <circle cx="185" cy="280" r="3" fill="#475569"/>
  <circle cx="185" cy="295" r="3" fill="#475569"/>
  <circle cx="185" cy="310" r="3" fill="#475569"/>
  <!-- Buckle -->
  <rect x="215" y="275" width="14" height="30" rx="4" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>
  <rect x="219" y="283" width="6" height="14" rx="2" fill="#64748B"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" font-weight="500">Smart Fitness Tracker</text>
</svg>