<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bodyHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="grilleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <!-- Shadow under speaker -->
  <ellipse cx="200" cy="340" rx="90" ry="14" fill="#0F172A" opacity="0.12"/>
  <!-- Main body -->
  <g filter="url(#shadow)">
    <!-- Body - cylindrical-ish shape -->
    <rect x="110" y="120" width="180" height="200" rx="24" fill="url(#bodyGrad)"/>
    <!-- Body highlight -->
    <rect x="110" y="120" width="180" height="100" rx="24" fill="url(#bodyHighlight)"/>
    <!-- Left edge highlight -->
    <rect x="112" y="124" width="6" height="192" rx="3" fill="#475569" opacity="0.3"/>
    <!-- Rubberized texture (subtle lines) -->
    <line x1="115" y1="145" x2="285" y2="145" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="155" x2="285" y2="155" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="165" x2="285" y2="165" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="175" x2="285" y2="175" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="255" x2="285" y2="255" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="265" x2="285" y2="265" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="275" x2="285" y2="275" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <line x1="115" y1="285" x2="285" y2="285" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <!-- Speaker grille (mesh area) -->
    <rect x="125" y="180" width="150" height="80" rx="10" fill="url(#grilleGrad)"/>
    <rect x="125" y="180" width="150" height="80" rx="10" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- Grille dots pattern -->
    <circle cx="140" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="155" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="170" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="185" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="200" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="215" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="230" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="245" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="260" cy="195" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="140" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="155" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="170" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="185" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="200" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="215" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="230" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="245" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="260" cy="210" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="140" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="155" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="170" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="185" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="200" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="215" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="230" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="245" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="260" cy="225" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="140" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="155" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="170" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="185" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="200" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="215" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="230" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="245" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <circle cx="260" cy="240" r="2" fill="#0F172A" opacity="0.6"/>
    <!-- Orange accent stripe -->
    <rect x="110" y="268" width="180" height="6" fill="url(#accentGrad)"/>
    <!-- Brand logo area -->
    <rect x="170" y="285" width="60" height="20" rx="4" fill="#1E293B"/>
    <text x="200" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748B" font-weight="700" letter-spacing="1.5">DROP-AI</text>
    <!-- Top panel -->
    <rect x="115" y="120" width="170" height="20" rx="10" fill="url(#topGrad)"/>
    <!-- Buttons on top -->
    <circle cx="155" cy="130" r="5" fill="#64748B"/>
    <circle cx="155" cy="130" r="3" fill="#94A3B8" opacity="0.5"/>
    <circle cx="200" cy="130" r="5" fill="#64748B"/>
    <circle cx="200" cy="130" r="3" fill="#94A3B8" opacity="0.5"/>
    <circle cx="245" cy="130" r="5" fill="#64748B"/>
    <circle cx="245" cy="130" r="3" fill="#94A3B8" opacity="0.5"/>
    <!-- Power indicator LED -->
    <circle cx="200" cy="130" r="1.5" fill="#22C55E" filter="url(#glow)"/>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" font-weight="600" letter-spacing="0.5">Waterproof Bluetooth Speaker</text>
</svg>