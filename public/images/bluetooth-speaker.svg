<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="12" fill="#F8FAFC"/>
  <!-- Speaker body -->
  <rect x="110" y="80" width="180" height="220" rx="30" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="120" y="90" width="160" height="200" rx="25" fill="#334155"/>
  <!-- Top accent -->
  <rect x="130" y="95" width="140" height="6" rx="3" fill="#475569"/>
  <!-- Speaker grille - main (top) -->
  <circle cx="200" cy="155" r="45" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="200" cy="155" r="35" fill="#1E293B"/>
  <circle cx="200" cy="155" r="25" fill="#0F172A" opacity="0.5"/>
  <circle cx="200" cy="155" r="15" fill="#1E293B"/>
  <circle cx="200" cy="155" r="5" fill="#475569"/>
  <!-- Speaker grille - bottom (passive radiator) -->
  <ellipse cx="200" cy="240" rx="35" ry="20" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
  <ellipse cx="200" cy="240" rx="28" ry="15" fill="#0F172A" opacity="0.4"/>
  <!-- Control buttons -->
  <circle cx="160" cy="270" r="6" fill="#475569"/>
  <path d="M158 268 L158 272" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="200" cy="270" r="6" fill="#475569"/>
  <polygon points="199,267 203,270 199,273" fill="#94A3B8"/>
  <circle cx="240" cy="270" r="6" fill="#475569"/>
  <path d="M240 267 L244 270 L240 273" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- LED indicator -->
  <circle cx="200" cy="286" r="3" fill="#22C55E"/>
  <!-- Carabiner clip -->
  <path d="M200 80 Q200 60 210 55 Q220 50 220 65 Q220 78 210 80" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="210" y1="55" x2="210" y2="65" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <!-- IPX7 badge -->
  <rect x="250" y="95" width="32" height="16" rx="4" fill="#3B82F6" opacity="0.8"/>
  <text x="266" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="white" font-weight="bold">IPX7</text>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" font-weight="500">Waterproof Bluetooth Speaker</text>
</svg>