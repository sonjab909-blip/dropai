<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="armVertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="baseTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ledPanelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <!-- Shadow under lamp base -->
  <ellipse cx="200" cy="340" rx="80" ry="12" fill="#0F172A" opacity="0.1"/>
  <!-- Base -->
  <g filter="url(#shadow)">
    <ellipse cx="200" cy="325" rx="65" ry="16" fill="url(#baseGrad)"/>
    <ellipse cx="200" cy="323" rx="60" ry="13" fill="url(#baseTopGrad)"/>
    <!-- Base top highlight -->
    <ellipse cx="200" cy="320" rx="55" ry="10" fill="#334155" opacity="0.5"/>
    <!-- Touch controls on base -->
    <circle cx="180" cy="320" r="4" fill="#475569"/>
    <circle cx="195" cy="320" r="4" fill="#475569"/>
    <circle cx="210" cy="320" r="4" fill="#475569"/>
    <circle cx="225" cy="320" r="4" fill="#475569"/>
    <!-- Power indicator -->
    <circle cx="180" cy="320" r="2" fill="#22C55E" filter="url(#glow)"/>
  </g>
  <!-- Lower arm (vertical-ish) -->
  <g filter="url(#softShadow)">
    <rect x="192" y="225" width="16" height="100" rx="6" fill="url(#armVertGrad)" stroke="#CBD5E1" stroke-width="0.5"/>
    <rect x="195" y="228" width="10" height="94" rx="4" fill="#FFFFFF" opacity="0.3"/>
  </g>
  <!-- Joint -->
  <circle cx="200" cy="225" r="10" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="1" filter="url(#softShadow)"/>
  <circle cx="200" cy="225" r="5" fill="#64748B"/>
  <circle cx="200" cy="225" r="3" fill="#94A3B8"/>
  <!-- Upper arm (angled) -->
  <g filter="url(#softShadow)">
    <path d="M200 225 L180 145 L196 145 L216 225 Z" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="0.5"/>
    <path d="M200 225 L182 145 L186 145 L204 225 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>
  <!-- Head joint -->
  <circle cx="188" cy="145" r="8" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="1" filter="url(#softShadow)"/>
  <circle cx="188" cy="145" r="4" fill="#64748B"/>
  <circle cx="188" cy="145" r="2.5" fill="#94A3B8"/>
  <!-- LED Head -->
  <g filter="url(#shadow)">
    <!-- LED panel housing -->
    <rect x="130" y="95" width="120" height="50" rx="10" fill="url(#ledPanelGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- LED panel surface -->
    <rect x="138" y="100" width="104" height="40" rx="6" fill="#E2E8F0"/>
    <!-- LED light glow -->
    <rect x="142" y="104" width="96" height="32" rx="4" fill="url(#ledGlow)" opacity="0.8" filter="url(#glow)"/>
    <!-- LED strip effect -->
    <rect x="145" y="108" width="90" height="2" rx="1" fill="#FFFFFF" opacity="0.5"/>
    <rect x="145" y="114" width="90" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="145" y="120" width="90" height="2" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="145" y="126" width="90" height="2" rx="1" fill="#FFFFFF" opacity="0.2"/>
    <!-- Head top highlight -->
    <rect x="134" y="97" width="112" height="8" rx="4" fill="#FFFFFF" opacity="0.3"/>
    <!-- Ambient light spill -->
    <path d="M142 140 Q190 170 238 140" fill="#60A5FA" opacity="0.08" filter="url(#glowSoft)"/>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" font-weight="600" letter-spacing="0.5">Smart LED Desk Lamp</text>
</svg>