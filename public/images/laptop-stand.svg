<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <!-- Shadow under stand -->
  <ellipse cx="200" cy="335" rx="110" ry="14" fill="#0F172A" opacity="0.1"/>
  <!-- Base of stand -->
  <g filter="url(#shadow)">
    <!-- Base - bottom plate -->
    <rect x="80" y="290" width="240" height="10" rx="5" fill="url(#baseGrad)"/>
    <!-- Base - front lip -->
    <rect x="80" y="290" width="240" height="14" rx="5" fill="url(#baseGrad)"/>
    <!-- Base highlight -->
    <rect x="85" y="290" width="230" height="6" rx="3" fill="url(#highlightGrad)"/>
    <!-- Rear support bar -->
    <rect x="100" y="270" width="200" height="22" rx="6" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="0.5" filter="url(#softShadow)"/>
    <!-- Rear support highlight -->
    <rect x="104" y="272" width="192" height="8" rx="3" fill="#FFFFFF" opacity="0.3"/>
    <!-- Ventilation holes in rear support -->
    <circle cx="130" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="150" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="170" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="190" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="210" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="230" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="250" cy="281" r="3" fill="#CBD5E1"/>
    <circle cx="270" cy="281" r="3" fill="#CBD5E1"/>
  </g>
  <!-- Main support arm (angled, going up) -->
  <g filter="url(#shadow)">
    <!-- Left arm -->
    <path d="M120 270 L155 130 L165 130 L135 270 Z" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="0.5"/>
    <!-- Right arm -->
    <path d="M280 270 L245 130 L235 130 L265 270 Z" fill="url(#armGrad)" stroke="#CBD5E1" stroke-width="0.5"/>
    <!-- Arm highlights -->
    <path d="M122 268 L156 132 L158 132 L137 268 Z" fill="#FFFFFF" opacity="0.2"/>
    <path d="M278 268 L244 132 L242 132 L263 268 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>
  <!-- Top platform (angled laptop surface) -->
  <g filter="url(#shadow)">
    <path d="M100 140 L300 140 L280 110 L120 110 Z" fill="url(#topGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Top surface highlight -->
    <path d="M105 138 L295 138 L278 112 L122 112 Z" fill="url(#highlightGrad)"/>
    <!-- Ventilation slots on top -->
    <rect x="140" y="118" width="120" height="2" rx="1" fill="#94A3B8" opacity="0.5"/>
    <rect x="140" y="124" width="120" height="2" rx="1" fill="#94A3B8" opacity="0.5"/>
    <rect x="140" y="130" width="120" height="2" rx="1" fill="#94A3B8" opacity="0.5"/>
    <!-- Front lip of top platform -->
    <path d="M100 140 L300 140 L300 144 L100 144 Z" fill="#94A3B8"/>
    <!-- Anti-slip pads -->
    <rect x="115" y="136" width="20" height="4" rx="2" fill="#475569" opacity="0.6"/>
    <rect x="265" y="136" width="20" height="4" rx="2" fill="#475569" opacity="0.6"/>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" font-weight="600" letter-spacing="0.5">Ergonomic Laptop Stand</text>
</svg>