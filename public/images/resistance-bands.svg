<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bandHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <!-- Shadow under bands -->
  <ellipse cx="200" cy="340" rx="100" ry="14" fill="#0F172A" opacity="0.1"/>
  <!-- Bands stacked from bottom to top -->
  <g filter="url(#shadow)">
    <!-- Black band (thickest, bottom) -->
    <ellipse cx="200" cy="300" rx="75" ry="20" fill="url(#blackGrad)"/>
    <ellipse cx="200" cy="296" rx="75" ry="18" fill="url(#blackGrad)"/>
    <ellipse cx="200" cy="296" rx="75" ry="18" fill="url(#bandHighlight)"/>
    <ellipse cx="200" cy="296" rx="70" ry="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="200" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" font-weight="600">XX-Large</text>
    
    <!-- Blue band -->
    <ellipse cx="200" cy="270" rx="70" ry="18" fill="url(#blueGrad)"/>
    <ellipse cx="200" cy="266" rx="70" ry="16" fill="url(#blueGrad)"/>
    <ellipse cx="200" cy="266" rx="70" ry="16" fill="url(#bandHighlight)"/>
    <ellipse cx="200" cy="266" rx="65" ry="13" fill="none" stroke="#1D4ED8" stroke-width="1" opacity="0.5"/>
    <text x="200" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">X-Large</text>
    
    <!-- Green band -->
    <ellipse cx="200" cy="242" rx="65" ry="16" fill="url(#greenGrad)"/>
    <ellipse cx="200" cy="238" rx="65" ry="14" fill="url(#greenGrad)"/>
    <ellipse cx="200" cy="238" rx="65" ry="14" fill="url(#bandHighlight)"/>
    <ellipse cx="200" cy="238" rx="60" ry="11" fill="none" stroke="#15803D" stroke-width="1" opacity="0.5"/>
    <text x="200" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">Large</text>
    
    <!-- Red band -->
    <ellipse cx="200" cy="216" rx="58" ry="14" fill="url(#redGrad)"/>
    <ellipse cx="200" cy="212" rx="58" ry="12" fill="url(#redGrad)"/>
    <ellipse cx="200" cy="212" rx="58" ry="12" fill="url(#bandHighlight)"/>
    <ellipse cx="200" cy="212" rx="53" ry="9" fill="none" stroke="#B91C1C" stroke-width="1" opacity="0.5"/>
    <text x="200" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">Medium</text>
    
    <!-- Yellow band (thinnest, top) -->
    <ellipse cx="200" cy="192" rx="50" ry="12" fill="url(#yellowGrad)"/>
    <ellipse cx="200" cy="188" rx="50" ry="10" fill="url(#yellowGrad)"/>
    <ellipse cx="200" cy="188" rx="50" ry="10" fill="url(#bandHighlight)"/>
    <ellipse cx="200" cy="188" rx="45" ry="7" fill="none" stroke="#A16207" stroke-width="1" opacity="0.5"/>
    <text x="200" y="191" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#854D0E" font-weight="600">Light</text>

    <!-- Side thickness visible (band edges) -->
    <path d="M125 296 Q125 192 150 188" stroke="#0F172A" stroke-width="1.5" fill="none" opacity="0.3"/>
    <path d="M275 296 Q275 192 250 188" stroke="#0F172A" stroke-width="1.5" fill="none" opacity="0.3"/>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" font-weight="600" letter-spacing="0.5">Fitness Resistance Bands Set</text>
</svg>